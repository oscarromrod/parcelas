spring:
  application:
    name: parcelas
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/ejemplo}"
    username: "${SPRING_DATASOURCE_USERNAME:usuario}"
    password: "${SPRING_DATASOURCE_PASSWORD:usuario}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true