<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <div th:fragment="tarjeta(titulo, valor, icono, color)" class="col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
                <div class="fs-2" th:classappend="'text-' + ${color}">
                    <i class="bi" th:classappend="${icono}"></i>
                </div>
                <div>
                    <div class="small text-body-secondary"
                         th:text="${titulo}">Indicador</div>
                    <div class="fs-4 fw-semibold" th:text="${valor}">0</div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:fragment="badgeCalidad(calidad)"
              th:switch="${calidad != null ? calidad.name() : null}">
        <span th:case="'EXTRA'" class="badge text-bg-success">
            <i class="bi bi-star-fill me-1"></i>Extra
        </span>
        <span th:case="'PRIMERA'" class="badge text-bg-primary">Primera</span>
        <span th:case="'SEGUNDA'" class="badge text-bg-warning">Segunda</span>
        <span th:case="*" class="badge text-bg-secondary">Sin calidad</span>
    </th:block>

</html>
