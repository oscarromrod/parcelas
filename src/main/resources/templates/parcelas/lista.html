<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Parcelas</title>
</head>
<body>
<div class="container mt-3">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/parcelas}">Parcelas</a>
            <a class="btn btn-outline-light" th:href="@{/parcelas/nueva}">
                + Nueva parcela
            </a>
        </div>
    </nav>
</div>

<div class="container mt-4">
    <h1 class="h3 mb-4">Listado de parcelas</h1>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-success">
                <tr>
                    <th>Nombre</th>
                    <th>Ubicación</th>
                    <th>Superficie (ha)</th>
                    <th>Cultivo</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(parcelas)}">
                    <td colspan="5" class="text-center text-secondary">
                        No hay parcelas registradas.
                    </td>
                </tr>
                <tr th:each="p : ${parcelas}">
                    <td>
                        <a th:href="@{/parcelas/{id}(id=${p.id})}"
                           th:text="${p.nombre}">Nombre</a>
                    </td>
                    <td th:text="${p.ubicacion}">Ubicación</td>
                    <td th:text="${p.superficie}">0.0</td>
                    <td th:text="${p.tipoCultivo != null ? p.tipoCultivo.etiqueta : 'Sin cultivo'}">
                        Cultivo
                    </td>
                    <td>
                        <form th:action="@{/parcelas/{id}/eliminar(id=${p.id})}"
                              method="post"
                              onsubmit="return confirm('¿Seguro que quieres eliminar esta parcela?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="superficie-total mt-3">
        Superficie total:
        <span th:text="${superficieTotal}">0.0</span> ha
    </div>

</div>
</body>
</html>
