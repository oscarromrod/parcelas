<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Listado de parcelas')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar('parcelas')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">

<div class="container mt-4">
    <h1 class="h3 mb-4">Listado de parcelas</h1>

    <a th:href="@{/parcelas/nueva}" class="btn btn-success mb-3">
        + Nueva parcela
    </a>

    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
            <form th:action="@{/parcelas}" method="get" class="row g-2">
                <div class="col-md-6">
                    <input type="text" name="q" th:value="${q}"
                           class="form-control" placeholder="Buscar parcela...">
                </div>
                <div class="col-md-4">
                    <select name="tipo" class="form-select">
                        <option value="TODOS" th:selected="${tipo == 'TODOS'}">Todos</option>
                        <option th:each="t : ${tipos}"
                                th:value="${t}"
                                th:text="${t.etiqueta}"
                                th:selected="${tipo == t.name()}">
                            Cultivo
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Buscar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-success">
                <tr>
                    <th>Nombre</th>
                    <th>Ubicación</th>
                    <th>Superficie (ha)</th>
                    <th>Cultivo</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(parcelas)}">
                    <td colspan="5" class="text-center text-secondary">
                        No hay parcelas registradas.
                    </td>
                </tr>
                <tr th:each="p : ${parcelas}">
                    <td>
                        <a th:href="@{/parcelas/{id}(id=${p.id})}"
                           th:text="${p.nombre}">Nombre</a>
                    </td>
                    <td th:text="${p.ubicacion}">Ubicación</td>
                    <td th:text="${p.superficie}">0.0</td>
                    <td th:text="${p.tipoCultivo != null ? p.tipoCultivo.etiqueta : 'Sin cultivo'}">
                        Cultivo
                    </td>
                    <td>
                        <div class="d-flex align-items-center">
                            <a th:href="@{/parcelas/editar/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                Editar
                            </a>

                            <form th:action="@{/parcelas/{id}/eliminar(id=${p.id})}"
                                  method="post"
                                  onsubmit="return confirm('¿Seguro que quieres eliminar esta parcela?');"
                                  class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm border-0 mt-3">
        <div class="card-body py-2 px-3 d-flex justify-content-end align-items-center">
            <span class="text-secondary me-2">Superficie total:</span>
            <span class="fw-bold text-success fs-5">
            <span th:text="${superficieTotal}">0.0</span> ha
        </span>
        </div>
    </div>

</div>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
