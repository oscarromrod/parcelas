<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{parcelas/fragments/layout :: head('Listado de parcelas')}"></head>

<body>

<nav th:replace="~{parcelas/fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{parcelas/fragments/layout :: sidebar('parcelas')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">

<div class="container mt-4">
    <h1 class="h3 mb-4">Listado de parcelas</h1>

    <a th:href="@{/parcelas/nueva}" class="btn btn-success mb-3">
        + Nueva parcela
    </a>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-success">
                <tr>
                    <th>Nombre</th>
                    <th>Ubicación</th>
                    <th>Superficie (ha)</th>
                    <th>Cultivo</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(parcelas)}">
                    <td colspan="5" class="text-center text-secondary">
                        No hay parcelas registradas.
                    </td>
                </tr>
                <tr th:each="p : ${parcelas}">
                    <td>
                        <a th:href="@{/parcelas/{id}(id=${p.id})}"
                           th:text="${p.nombre}">Nombre</a>
                    </td>
                    <td th:text="${p.ubicacion}">Ubicación</td>
                    <td th:text="${p.superficie}">0.0</td>
                    <td th:text="${p.tipoCultivo != null ? p.tipoCultivo.etiqueta : 'Sin cultivo'}">
                        Cultivo
                    </td>
                    <td>
                        <form th:action="@{/parcelas/{id}/eliminar(id=${p.id})}"
                              method="post"
                              onsubmit="return confirm('¿Seguro que quieres eliminar esta parcela?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="superficie-total mt-3">
        Superficie total:
        <span th:text="${superficieTotal}">0.0</span> ha
    </div>

</div>
        <footer th:replace="~{parcelas/fragments/layout :: footer}"></footer>
    </main>
</div>

<th:block th:replace="~{parcelas/fragments/layout :: scripts}"></th:block>

</body>
</html>
