<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Nueva parcela</title>
</head>
<body>

<div class="container mt-3">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/parcelas}">Parcelas</a>
        </div>
    </nav>
</div>

<div class="container mt-4">
    <div class="card mt-3 shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">Registrar parcela</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/parcelas}"
                  th:object="${parcela}"
                  method="post">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="ubicacion" class="form-label">Ubicación</label>
                    <input id="ubicacion" type="text"
                           th:field="*{ubicacion}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="superficie" class="form-label">Superficie (ha)</label>
                    <input id="superficie" type="number"
                           th:field="*{superficie}"
                           class="form-control"
                           step="0.01"
                           min="0.01"
                           required>
                </div>

                <div class="mb-3">
                    <label for="tipoCultivo" class="form-label">Cultivo</label>
                    <select id="tipoCultivo" th:field="*{tipoCultivo}"
                            class="form-select"
                            required>
                        <option value="">-- Selecciona --</option>
                        <option th:each="t : ${tipos}"
                                th:value="${t}"
                                th:text="${t.etiqueta}">
                            Cultivo
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/parcelas}" class="btn btn-outline-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
