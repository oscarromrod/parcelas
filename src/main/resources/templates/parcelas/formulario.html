<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Parcelas')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar('parcelas')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">
        <div class="container mt-4">
            <div class="card mt-3 shadow-sm border-0 mx-auto" style="max-width: 600px;">
                <div class="card-header bg-success text-white">
                    <h1 class="h5 mb-0"
                        th:text="${parcela.id != null ? 'Editar parcela' : 'Registrar parcela'}">
                        Registrar parcela
                    </h1>
                </div>

                <div class="card-body">
                    <!--/* th:object enlaza los campos del formulario con el objeto y permite mostrar sus errores. */-->
                    <form th:action="@{/parcelas}"
                          th:object="${parcela}"
                          method="post">

                        <div class="alert alert-danger" role="alert"
                             th:if="${#fields.hasErrors('*')}">
                            Revisa los campos indicados.
                        </div>

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input id="nombre" type="text"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   required maxlength="60">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="ubicacion" class="form-label">Ubicación</label>
                            <input id="ubicacion" type="text"
                                   th:field="*{ubicacion}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   required maxlength="80">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('ubicacion')}"
                                 th:errors="*{ubicacion}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="superficie" class="form-label">Superficie (ha)</label>
                            <input id="superficie" type="number"
                                   th:field="*{superficie}"
                                   class="form-control"
                                   th:errorclass="is-invalid"
                                   required min="0.01" max="5000" step="0.01">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('superficie')}"
                                 th:errors="*{superficie}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="tipoCultivo" class="form-label">Cultivo</label>
                            <select id="tipoCultivo"
                                    th:field="*{tipoCultivo}"
                                    class="form-select"
                                    th:errorclass="is-invalid"
                                    required>
                                <option value="">-- Selecciona --</option>
                                <option th:each="t : ${tipos}"
                                        th:value="${t}"
                                        th:text="${t.etiqueta}">
                                    Cultivo
                                </option>
                            </select>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('tipoCultivo')}"
                                 th:errors="*{tipoCultivo}">Error</div>
                        </div>

                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a th:href="@{/parcelas}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </form>
                </div>
            </div>
        </div>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
