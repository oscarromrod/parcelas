<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Detalle de parcela</title>
</head>
<body>

<div class="container mt-3">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/parcelas}">Parcelas</a>
            <a class="btn btn-outline-light" th:href="@{/parcelas/nueva}">
                + Nueva parcela
            </a>
        </div>
    </nav>
</div>

<div class="container mt-4">

    <div class="card mt-3 shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <h4 class="mt-3 text-center">Detalles de la parcela</h4>
        <div class="card-body p-4 p-md-5">
            <h4 class="card-title mb-4" th:text="${parcela.nombre}">
                Nombre de la parcela
            </h4>

            <dl class="row mb-0">
                <dt class="col-sm-4">Identificador</dt>
                <dd class="col-sm-8" th:text="${parcela.id}">1</dd>

                <dt class="col-sm-4">Ubicación</dt>
                <dd class="col-sm-8" th:text="${parcela.ubicacion}">Ubicación</dd>

                <dt class="col-sm-4">Superficie</dt>
                <dd class="col-sm-8">
                    <span th:text="${parcela.superficie}">0.0</span> ha
                </dd>

                <dt class="col-sm-4">Cultivo</dt>
                <dd class="col-sm-8"
                    th:text="${parcela.tipoCultivo != null ? parcela.tipoCultivo.etiqueta : 'Sin cultivo'}">
                    Cultivo
                </dd>
            </dl>

            <div class="text-center mt-4">
                <a th:href="@{/parcelas}" class="btn btn-outline-secondary">
                    Volver al listado
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
