<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{parcelas/fragments/layout :: head('Detalle de parcela')}"></head>
<body>

<nav th:replace="~{parcelas/fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{parcelas/fragments/layout :: sidebar('parcelas')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">
<div class="container mt-4">

    <div class="card mt-3 shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <h4 class="mt-3 text-center">Detalles de la parcela</h4>
        <div class="card-body p-4 p-md-5">
            <h4 class="card-title mb-4" th:text="${parcela.nombre}">
                Nombre de la parcela
            </h4>

            <dl class="row mb-0">
                <dt class="col-sm-4">Identificador</dt>
                <dd class="col-sm-8" th:text="${parcela.id}">1</dd>

                <dt class="col-sm-4">Ubicación</dt>
                <dd class="col-sm-8" th:text="${parcela.ubicacion}">Ubicación</dd>

                <dt class="col-sm-4">Superficie</dt>
                <dd class="col-sm-8">
                    <span th:text="${parcela.superficie}">0.0</span> ha
                </dd>

                <dt class="col-sm-4">Cultivo</dt>
                <dd class="col-sm-8"
                    th:text="${parcela.tipoCultivo != null ? parcela.tipoCultivo.etiqueta : 'Sin cultivo'}">
                    Cultivo
                </dd>
            </dl>

            <div class="text-center mt-4">
                <a th:href="@{/parcelas}" class="btn btn-outline-secondary">
                    Volver al listado
                </a>
            </div>
        </div>
    </div>
</div>
        <footer th:replace="~{parcelas/fragments/layout :: footer}"></footer>
    </main>
</div>

<th:block th:replace="~{parcelas/fragments/layout :: scripts}"></th:block>

</body>
</html>
